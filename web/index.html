<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Botz</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/static/icon.svg">
<link rel="apple-touch-icon" href="/static/icon.svg">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="/static/style.css?v=29">
</head>
<body>
<header class="top">
  <div class="status"><span class="dot" id="dot"></span><span id="meta">загрузка…</span></div>
  <div class="hbtns"><button class="icon-btn" id="btn-notify" title="Уведомления"><svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg></button><button class="icon-btn" id="btn-theme" title="Тема"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg></button><button class="icon-btn" id="btn-tick" title="Проверить рынок сейчас">⟳</button></div>
</header>

<main id="view"></main>

<nav class="tabs" id="tabs">
  <button data-tab="home" class="active"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.5V20h13v-9.5"/><path d="M10 20v-5h4v5"/></svg><span>Главная</span></button>
  <button data-tab="desks"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/><path d="M7 12l3-3 3 2 4-4"/></svg><span>Дески</span></button>
  <button data-tab="interns"><svg viewBox="0 0 24 24"><path d="M4 20c0-3.5 3.5-6 8-6s8 2.5 8 6"/><circle cx="12" cy="8" r="4"/><path d="M17 3l1.5 1.5L21 2"/></svg><span>Стажёры</span></button>
  <button data-tab="company"><svg viewBox="0 0 24 24"><path d="M4 21V5a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v16"/><path d="M14 10h5a1 1 0 0 1 1 1v10"/><path d="M8 8h2M8 12h2M8 16h2M17 14h1M17 17h1"/><path d="M2 21h20"/></svg><span>Компания</span></button>
  <button data-tab="reports"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg><span>Отчёты</span></button>
</nav>

<div class="modal" id="modal"><div class="box" id="modal-box"></div></div>
<script src="/static/app.js?v=29"></script>
</body>
</html>
