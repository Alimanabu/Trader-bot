name: Android APK

on:
  push:
    branches: ["**"]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build release APK
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk trader-department.apk

      - uses: actions/upload-artifact@v4
        with:
          name: trader-department-apk
          path: trader-department.apk

      - name: Publish release "android-latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Отдел BTC-агентов · Android
          body: |
            Приложение для телефона. Скачайте trader-department.apk, откройте на Android и разрешите установку.
            При первом запуске введите адрес панели (например http://2.28.234.131:8080) и пароль.
            Сборка №${{ github.run_number }}.
          files: trader-department.apk
          prerelease: false
