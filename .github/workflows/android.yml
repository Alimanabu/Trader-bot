name: Android APK

on:
  push:
    branches: ["**"]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build release APK
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk crazycats.apk

      - uses: actions/upload-artifact@v4
        with:
          name: crazycats-apk
          path: crazycats.apk

      - name: Remove old asset name
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete-asset android-latest trader-department.apk -y || true

      - name: Publish release "android-latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: CrazyCats · Android
          body: |
            Приложение CrazyCats для телефона. Скачайте crazycats.apk, откройте на Android и разрешите установку.
            Если раньше стояла старая версия «Отдел BTC», сначала удалите её.
            При первом запуске введите адрес панели (например http://2.28.234.131:8080) и пароль.
            Версия 1.0.${{ github.run_number }}.
          files: crazycats.apk
          prerelease: false
