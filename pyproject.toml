[project]
name = "trader-bot"
version = "0.1.0"
description = "Отдел из десяти агентов, торгующих биткоином на демосчёте, с руководителем, риск-менеджером и отделом исследований"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "anthropic>=1.5",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
trader = "trader.cli:main"

[tool.setuptools.packages.find]
include = ["trader*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
